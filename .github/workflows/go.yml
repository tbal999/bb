name: TEST & PUML

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet & test
        run: make test

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: multi-user smoke test
        run: make smoke

  puml:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: ./mainrepo
      - uses: actions/setup-go@v5
        with:
          go-version-file: ./mainrepo/go.mod
      - name: checkout plantuml
        uses: actions/checkout@v4
        with:
          repository: bykof/go-plantuml
          path: ./plantuml
      - name: create puml file
        run: |
          cd ./plantuml
          go mod tidy
          go run . generate -d ../mainrepo -r
          rm -f ../mainrepo/graph.puml ../mainrepo/graph.png
          cp graph.puml ../mainrepo
      - name: generate puml png diagram
        uses: cloudbees/plantuml-github-action@master
        with:
          args: -v -tpng ./mainrepo/graph.puml
      - name: commit diagram
        run: |
          cd ./mainrepo
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add graph.png graph.puml
          git diff --cached --quiet || git commit -m "generated puml & png image"
          git push
